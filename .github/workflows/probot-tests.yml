name: ProBot AI tests
on:
  push:
    branches: [probot-ai-integrated-build]
  pull_request:
    branches: [probot-ai-integrated-build]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scikit-learn joblib pytest
      - run: python -m pytest -q
